schema_version: "1.0"
name: happy-path
description: >
  Three chained AFK tickets (numbering differs from dependency order: 02, then 03, then 01)
  in a small node fixture repo. /sdd must finish all three with one commit each, a Ledger
  holding the Gate Ruling, and a green Gate. Grades end state only.
  Once all three are done a Branch review must run (code-review on Opus); any bug tickets it
  files may add commits, so the one-commit grader counts only tickets 01-03.
  Needs Bash, so it lives outside the default evals/ suite. Run it with:
  claude plugin eval . --trust-plugin --eval-dir evals-e2e --scaffold --allow-tools Bash Write Edit --ablation none
tags: [e2e]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /sdd demo
  max_turns: 120
  timeout_seconds: 3600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Agent, Skill, SendMessage, ToolSearch]
runs: 1
graders:
  - type: regex
    name: ticket-02-done
    target: {source: file, path: .scratch/demo/issues/02-slugify.md}
    pattern: 'Status:\**\s*done \([0-9a-f]{7,40}\)'
  - type: regex
    name: ticket-03-done
    target: {source: file, path: .scratch/demo/issues/03-strip-punctuation.md}
    pattern: 'Status:\**\s*done \([0-9a-f]{7,40}\)'
  - type: regex
    name: ticket-01-done
    target: {source: file, path: .scratch/demo/issues/01-unique-slug.md}
    pattern: 'Status:\**\s*done \([0-9a-f]{7,40}\)'
  - type: regex
    name: one-commit-per-ticket
    target: {source: file, path: .git/logs/HEAD}
    pattern: '\(ticket 0[123]\)\n'
    match: count:3
  - type: regex
    name: dependency-order
    target: {source: file, path: .git/logs/HEAD}
    pattern: '\(ticket 02\)[\s\S]*\(ticket 03\)[\s\S]*\(ticket 01\)'
  - type: regex
    name: gate-green
    target: {source: file, path: .gate-result}
    pattern: '^green'
  - type: llm
    name: ledger
    focus: {source: file, path: .scratch/demo/ledger.md}
    criteria: >
      The Ledger records the Gate command `npm test` as a Ruling with a reason and a cost if wrong,
      and records tickets 01, 02 and 03 each as done with a commit sha. Its `## Run` section
      has a `Branch review:` line pointing at a branch review file.
  - type: tool_used
    name: implementer-dispatched
    tool: Agent
    input_match: 'cwi-skills:implementer'
    min: 3
  - type: tool_used
    name: branch-review-dispatched
    tool: Agent
    input_match: 'cwi-skills:branch-reviewer'
    min: 1
  - type: tool_used
    name: code-review-skill-used
    tool: Skill
    input_match: 'mattpocock-skills:code-review'
    min: 1
  - type: regex
    name: branch-review-written
    target: {source: file, path: .scratch/demo/runs/branch-review-0.md}
    pattern: '## Findings'
  - type: tool_used
    name: tdd-skill-used
    tool: Skill
    input_match: 'mattpocock-skills:tdd'
    min: 3
  - type: llm
    name: operator-edits-state-only
    focus: trace
    criteria: >
      Every Write or Edit call made by the top-level agent (the Operator, not a dispatched
      subagent) targets a file under `.scratch/demo/`. Calls made inside an Implementer
      subagent do not count.
