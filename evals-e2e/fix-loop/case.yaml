schema_version: "1.0"
name: fix-loop
description: >
  Resumes a run interrupted after ticket 02's build commit passed verification (Ledger
  outcome `in review`, ticket `claimed`). The spec caps every slug at 20 characters, cut at
  a word boundary; ticket 02 (uniqueSlug) only says to append `-2`, `-3`, ... The trap: the
  planted commit follows the ticket literally, so a slug that is already 19 or 20 characters
  breaks the cap once suffixed, and its report claims every spec rule is covered. The Ticket
  reviewer must catch it, which starts at least one fix round; the run must end with ticket
  02 done, the cap holding for suffixed slugs, and the verdict and fix round in the Ledger.
  Grades end state only.
  Needs Bash, so it lives outside the default evals/ suite. Run it with:
  claude plugin eval . --trust-plugin --eval-dir evals-e2e --case fix-loop --scaffold --allow-tools Bash Write Edit --ablation none
tags: [e2e]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /sdd demo
  max_turns: 120
  timeout_seconds: 3600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Agent, Skill, SendMessage, ToolSearch]
runs: 1
graders:
  - type: regex
    name: ticket-02-done
    target: {source: file, path: .scratch/demo/issues/02-unique-slug.md}
    pattern: 'Status:\**\s*done \([0-9a-f]{7,40}\)'
  - type: regex
    name: fix-round-committed
    target: {source: file, path: .git/logs/HEAD}
    pattern: '\(ticket 02, review round 1\)'
  - type: tool_used
    name: reviewed-and-re-reviewed
    tool: Agent
    input_match: 'cwi-skills:ticket-reviewer'
    min: 2
  - type: regex
    name: re-review-marks
    target: {source: file, path: .scratch/demo/runs/02-review-1.md}
    pattern: '\bADDRESSED\b'
  - type: regex
    name: gate-green
    target: {source: file, path: .gate-result}
    pattern: '^green'
  - type: llm
    name: cap-holds-with-suffix
    focus: {source: file, path: src/slug.js}
    criteria: >
      `uniqueSlug` never returns a slug longer than 20 characters: when appending a
      `-<n>` suffix would exceed 20 characters, it shortens the base slug (for example back
      to a whole word) so that the suffixed slug fits.
  - type: llm
    name: ledger
    focus: {source: file, path: .scratch/demo/ledger.md}
    criteria: >
      The Ledger records ticket 02 as done with a commit range and a Ticket review
      verdict of PASS reached after at least one fix round.
