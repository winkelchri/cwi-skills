schema_version: "1.0"
name: branch-review
description: >
  Resumes a run whose three tickets are all done on sdd/demo, just before the Branch review.
  The spec says a slug holds only single hyphens, never starts or ends with "-", and is
  "untitled" for a title with no letters or digits; no ticket repeats those rules, and the
  planted commits follow the tickets literally, so slugify("- Hello -") returns "--hello--". The Branch review (code-review on Opus) must
  catch it and file a bug ticket 04 (Type bug, Found by branch review, ready-for-agent);
  04 goes through the normal loop; exactly one re-review follows; the run reaches the Final
  Checkpoint with the Gate green and pushes nothing. Headless runs have no AskUserQuestion,
  so the Final Checkpoint offers push, PR and cleanup in the final message and performs
  none. Grades end state only.
  Needs Bash, so it lives outside the default evals/ suite. Run it with:
  claude plugin eval . --trust-plugin --eval-dir evals-e2e --case branch-review --scaffold --allow-tools Bash Write Edit --ablation none
tags: [e2e]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /sdd demo
  max_turns: 120
  timeout_seconds: 3600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Agent, Skill, SendMessage, ToolSearch]
runs: 1
graders:
  - type: tool_used
    name: review-and-one-re-review
    tool: Agent
    input_match: 'cwi-skills:branch-reviewer'
    min: 2
    max: 2
  - type: tool_used
    name: code-review-skill-used
    tool: Skill
    input_match: 'mattpocock-skills:code-review'
    min: 1
  - type: regex
    name: bug-ticket-committed
    target: {source: file, path: .git/logs/HEAD}
    pattern: '\(ticket 04\)'
  - type: regex
    name: re-review-marks
    target: {source: file, path: .scratch/demo/runs/branch-review-1.md}
    pattern: '\bADDRESSED\b'
  - type: regex
    name: gate-green
    target: {source: file, path: .gate-result}
    pattern: '^green'
  - type: regex
    name: final-gate-ran
    target: {source: file, path: .scratch/demo/runs/gate-final.log}
    pattern: '# pass \d+'
  - type: regex
    name: run-ends-on-run-branch
    target: {source: file, path: .git/HEAD}
    pattern: 'refs/heads/sdd/demo'
  - type: llm
    name: hyphens-fixed
    focus: {source: file, path: src/slug.js}
    criteria: >
      `slugify` never returns a slug that starts or ends with "-" or holds two hyphens in a
      row: for example "- Hello -" gives "hello" and "Hello - World" gives "hello-world".
  - type: llm
    name: bug-ticket-filed
    focus: trace
    criteria: >
      The Operator (top-level agent) created a ticket file `.scratch/demo/issues/04-*.md`
      containing `Type:` bug, `Found by:` branch review, a `Finding:` line naming a branch
      review file, and `Status:` ready-for-agent, and that ticket's status later became
      `done (<sha>)`.
  - type: llm
    name: ledger
    focus: {source: file, path: .scratch/demo/ledger.md}
    criteria: >
      The Ledger's `## Run` section has a `Branch review:` line saying the review was
      re-reviewed, naming ticket 04 as filed and both the review and re-review files. The
      tickets table records ticket 04 as done with a commit range and a Ticket review verdict.
  - type: llm
    name: no-push-offered-only
    focus: trace
    criteria: >
      No `git push`, `gh pr create`, `git branch -d`/`-D` or `git worktree remove` command was
      run. The Operator's final message offers pushing, opening a PR and cleanup as options
      (with commands) without performing them, and lists the Rulings and the deferred findings.
