schema_version: "1.0"
name: branch-review
description: >
  Resumes a run interrupted right after its first Branch review returned: tickets 01-03 are
  done on sdd/demo and the Ledger's `Branch review:` line is at `filing — round 0`, with no
  ticket filed yet. The spec says a slug holds only single hyphens, never starts or ends with
  "-", and is "untitled" for a title with no letters or digits; no ticket repeats those
  rules, and the planted commits follow the tickets literally, so slugify("- Hello -")
  returns "--hello--". Ticket 03's planted commit declares an unused MAX_TITLE_LENGTH
  constant. The planted review (planted/branch-review-0.md) reports both, as one
  unambiguous finding B1 and one Minor M1, and no judgement call, so the run never needs
  the human: the live first review classified findings as judgement calls on some runs,
  which stopped the headless run at a Checkpoint. On resume the Operator files bug ticket
  04 (B1) and a ticket for M1 (Type bug, Found by branch review, ready-for-agent) and builds
  them through the normal loop; a live Branch reviewer (code-review on Opus) then
  re-reviews the whole branch after each fix wave until a re-review is clean, at most 3
  times. The run reaches the Final Checkpoint with the Gate green and pushes nothing.
  Headless runs have no AskUserQuestion, so the Final Checkpoint offers push, PR and
  cleanup in the final message and performs none. Grades end state and traces.
  Needs Bash, so it lives outside the default evals/ suite. Run it with:
  claude plugin eval . --trust-plugin --eval-dir evals-e2e --case branch-review --scaffold --allow-tools Bash Write Edit --ablation none
tags: [e2e]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /sdd demo
  max_turns: 250
  timeout_seconds: 3600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Agent, Skill, SendMessage, ToolSearch]
runs: 1
graders:
  - type: tool_used
    name: one-to-three-re-reviews
    tool: Agent
    input_match: 'cwi-skills:branch-reviewer'
    min: 1
    max: 3
  - type: llm
    name: minor-filed
    focus: trace
    criteria: >
      The Operator (top-level agent) created at least one ticket file under
      `.scratch/demo/issues/` (with Write or a shell command) whose `Finding:` line names a
      Minor id `M<n>` from a branch review file, with `Type:` bug and `Status:`
      ready-for-agent.
  - type: regex
    name: branch-minors-not-deferred-unfiled
    target: {source: file, path: .scratch/demo/ledger.md}
    pattern: '\n- branch review — '
    match: count:0
  - type: tool_used
    name: code-review-skill-used
    tool: Skill
    input_match: 'mattpocock-skills:code-review'
    min: 1
  - type: regex
    name: bug-ticket-committed
    target: {source: file, path: .git/logs/HEAD}
    pattern: '\(ticket 04\)'
  - type: regex
    name: re-review-marks
    target: {source: file, path: .scratch/demo/runs/branch-review-1.md}
    pattern: '\bADDRESSED\b'
  - type: regex
    name: gate-green
    target: {source: file, path: .gate-result}
    pattern: '^green'
  - type: regex
    name: final-gate-ran
    target: {source: file, path: .scratch/demo/runs/gate-final.log}
    pattern: '# pass \d+'
  - type: regex
    name: run-ends-on-run-branch
    target: {source: file, path: .git/HEAD}
    pattern: 'refs/heads/sdd/demo'
  - type: llm
    name: hyphens-fixed
    focus: {source: file, path: src/slug.js}
    criteria: >
      `slugify` never returns a slug that starts or ends with "-" or holds two hyphens in a
      row: for example "- Hello -" gives "hello" and "Hello - World" gives "hello-world".
  - type: llm
    name: bug-ticket-filed
    focus: trace
    criteria: >
      The Operator (top-level agent) created a ticket file `.scratch/demo/issues/04-*.md`
      containing `Type:` bug, `Found by:` branch review, a `Finding:` line naming a branch
      review file, and `Status:` ready-for-agent, and that ticket's status later became
      `done (<sha>)`.
  - type: llm
    name: ledger
    focus: {source: file, path: .scratch/demo/ledger.md}
    criteria: >
      The Ledger's `## Run` section has a `Branch review:` line reading `clean after K
      re-reviews` (K of 1, 2 or 3) or `capped after 3 re-reviews`, naming the review files.
      The tickets table records ticket 04 as done with a commit range and a Ticket review
      verdict.
  - type: llm
    name: no-push-offered-only
    focus: trace
    criteria: >
      No `git push`, `gh pr create`, `git branch -d`/`-D` or `git worktree remove` command was
      run. The Operator's final message offers pushing and opening a PR as options (with
      commands) without performing them, and offers cleanup of prototype branches and
      worktrees, or says none is needed when the run created none, and lists the Rulings and the open deferred
      findings (or says there are none).
  - type: regex
    name: smoke-logged-04
    target: {source: file, path: .scratch/demo/runs/04-smoke-0.log}
    pattern: '# fail 0'
